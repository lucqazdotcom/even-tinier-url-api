[package]
name = "even-tinier-url-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros",
"chrono"]}
tokio = { version = "1", features = ["full"]}
dotenvy = "0.15"
chrono = {version = "0.4", features = ["serde"]}
uuid = { version = "1", features = ["v4"] }
